# Netlify settings for the Coach Kwame 1-on-1 soccer training site (plain static site — no build step)
[build]
  publish = "."

# Photos rarely change: cache them for a week
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Basic security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Internal media / launch notes are not part of the public site
[[redirects]]
  from = "/kwame-notes.md"
  to = "/404.html"
  status = 404
  force = true

# The previous client's build is kept in the repo for reference only. It must never be served on this site.
[[redirects]]
  from = "/_old-client/*"
  to = "/404.html"
  status = 404
  force = true

# The original build's 3D pitch module is no longer loaded by the page
[[redirects]]
  from = "/pitch3d.js"
  to = "/404.html"
  status = 404
  force = true
