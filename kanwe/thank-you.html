<link rel="stylesheet" href="styles.css">
<style>
  .page { min-height: 100vh; display: grid; place-items: center; padding: 40px 20px; background: var(--green); color: var(--on-dark); text-align: center; }
  .page__inner { width: 100%; max-width: 640px; min-width: 0; }
  .page .h2 { margin-top: 24px; }
  .page p { margin-top: 18px; color: var(--on-dark-2); }
  .page .btn { margin-top: 30px; }
  .page__lane { width: 220px; height: 60px; margin: 0 auto; overflow: visible; }
  .page__lane path { fill: none; stroke: var(--lime); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: lane 1.4s cubic-bezier(.5, 0, .2, 1) .2s forwards; }
  .page__lane circle { fill: var(--on-dark); }
  .page__lane .goal { fill: none; stroke: var(--on-dark); stroke-width: 2.5; }
  @keyframes lane { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .page__lane path { animation: none; stroke-dashoffset: 0; } }
</style>
</head>

<main class="page">
  <div class="page__inner">
    <svg class="page__lane" viewBox="0 0 220 60" aria-hidden="true"><path pathLength="1" d="M10 50C60 10 120 60 196 30"/><circle cx="10" cy="50" r="5"/><path class="goal" d="M200 14h12v32h-12"/></svg>
    <h1 class="h2 h2--light">Inquiry sent. <em>Thank you!</em></h1>
